# Jenkins + SonarQube + a local image registry, all on your machine.
# 1) export JENKINS_ADMIN_PASSWORD='choose-one'     (never commit it)
# 2) docker compose up -d --build
# 3) Jenkins: http://localhost:8080 (admin / your password)   SonarQube: http://localhost:9000
# 4) In SonarQube create a token, then:  export SONAR_TOKEN=...  and  docker compose up -d --force-recreate jenkins
services:
  jenkins:
    build: ./jenkins
    ports:
      - "8080:8080"
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?set JENKINS_ADMIN_PASSWORD}
      SONAR_TOKEN: ${SONAR_TOKEN:-unset}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # lets the pipeline build images; see the security note in the README
    # The host's Docker socket is usually root-owned; running as root keeps the lab simple. Not for shared servers.
    user: root
    depends_on: [sonarqube, registry]
  sonarqube:
    image: sonarqube:community
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar_data:/opt/sonarqube/data
  registry:
    image: registry:2
    ports:
      - "5001:5000"   # 5001 on the host: macOS AirPlay Receiver already uses 5000
volumes:
  jenkins_home:
  sonar_data:
